name: Atlas Integrity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Atlas Integrity & Regression Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Search pinyin index is generated from js/map_data.js and must stay reproducible.
      # The full-history search ranking suite is not run here: this site ships the
      # 1921–1949 memorial dataset only, so upstream all-dynasty queries cannot match.
      - name: Verify generated event pinyin index is reproducible
        run: |
          npm ci --prefix scripts/search-pinyin --ignore-scripts --no-audit --no-fund
          npm run check --prefix scripts/search-pinyin

      - name: Run pinyin quick-search regressions over the shipped 1917–1949 events
        run: npm run test:memorial --prefix scripts/search-pinyin

      - name: Check asset cache-busting hashes are in sync
        run: node scripts/sync_version.js --check

      - name: Check polity border topology against baseline
        run: node scripts/audit_topology.js --check

      - name: Check prefecture layer against baseline
        run: node scripts/audit_prefectures.js --check

      - name: Check first-paint synchronous script gzip budget
        run: node scripts/perf_budget.js --check

      - name: Check responsive UI layout geometry and non-overlap
        run: node scripts/audit_layout.js --check
